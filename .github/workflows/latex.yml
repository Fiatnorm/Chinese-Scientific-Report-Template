name: Build LaTeX

on: [push, pull_request]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install TeX Live and Biber
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk biber texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-science texlive-fonts-recommended texlive-bibtex-extra fonts-texgyre
      - name: Compile and check the final log
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build main.tex
          test -s build/main.pdf
          test -s build/main.bbl
          if grep -En 'Missing character:|Overfull|undefined|Empty bibliography|Please \(re\)run Biber' build/main.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: build/main.pdf
          if-no-files-found: error
